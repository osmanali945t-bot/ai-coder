<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal AI Coder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Monaco Editor Integration -->
  <link rel="stylesheet" data-name="vs/css" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/vscode.min.css">
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen flex flex-col md:flex-row">

  <!-- বাম পাশের কন্ট্রোল প্যানেল ও চ্যাট -->
  <div class="w-full md:w-1/2 flex flex-col border-b md:border-b-0 md:border-r border-slate-800 p-4 space-y-4 h-screen">
    <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
      🚀 Universal AI Coder
    </h1>

    <!-- এপিআই কী ইনপুট -->
    <input
      id="apiKey"
      type="password"
      placeholder="আপনার Gemini API Key পেস্ট করুন..."
      class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-blue-500"
    />

    <!-- চ্যাট এরিয়া -->
    <div id="chatLog" class="flex-1 bg-slate-900 border border-slate-800 rounded p-4 overflow-y-auto space-y-3 text-sm">
      <div class="text-slate-500 text-center mt-10">
        কোডিংয়ের যেকোনো প্রশ্ন লিখুন অথবা ইউটিউব লিংক দিয়ে ভিডিও বিশ্লেষণ করুন।
      </div>
    </div>

    <!-- ইনপুট এরিয়া -->
    <div class="space-y-2">
      <input
        id="youtubeUrl"
        type="text"
        placeholder="ইউটিউব ভিডিও লিঙ্ক (ঐচ্ছিক)..."
        class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-red-500"
      />
      <div class="flex gap-2">
        <textarea
          id="prompt"
          rows="2"
          placeholder="আপনি কি ধরনের কোড বা সাহায্য চান লিখুন..."
          class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-blue-500"
        ></textarea>
        <button
          onclick="generateAIResponse()"
          id="sendBtn"
          class="px-4 bg-blue-600 hover:bg-blue-500 rounded font-semibold text-white flex items-center justify-center"
        >
          পাঠান
        </button>
      </div>
    </div>
  </div>

  <!-- ডান পাশের কোড এডিটর -->
  <div class="w-full md:w-1/2 flex flex-col bg-slate-900 h-screen">
    <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950">
      <span class="text-sm font-medium text-slate-400">Code Editor</span>
      <select id="languageSelect" onchange="changeLanguage()" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="cpp">C++</option>
        <option value="c">C</option>
        <option value="rust">Rust</option>
        <option value="html">HTML</option>
      </select>
    </div>
    <div id="editor" class="flex-1"></div>
  </div>

  <!-- Monaco Editor Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
  <script>
    let editor;
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: '// আপনার কোড এখানে জেনারেট হবে বা নিজে লিখুন...\n',
        language: 'javascript',
        theme: 'vs-dark',
        automaticLayout: true
      });
    });

    function changeLanguage() {
      const lang = document.getElementById('languageSelect').value;
      if (editor) {
        monaco.editor.setModelLanguage(editor.getModel(), lang);
      }
    }

    async function generateAIResponse() {
      const apiKey = document.getElementById('apiKey').value;
      const prompt = document.getElementById('prompt').value;
      const youtubeUrl = document.getElementById('youtubeUrl').value;
      const sendBtn = document.getElementById('sendBtn');
      const chatLog = document.getElementById('chatLog');

      if (!apiKey) {
        alert("অনুগমন করে আপনার Gemini API Key প্রদান করুন!");
        return;
      }

      if (!prompt && !youtubeUrl) {
        alert("কোনো প্রম্পট অথবা ইউটিউব লিংক দিন!");
        return;
      }

      sendBtn.innerText = "প্রসেসিং...";
      sendBtn.disabled = true;

      let fullPrompt = `আপনি একজন ওয়ার্ল্ড-ক্লাস এক্সপার্ট সফটওয়্যার ইঞ্জিনিয়ার। যেকোনো কোডিং ভাষায় আপনার নিখুঁত দক্ষতা রয়েছে।\n\n`;
      if (youtubeUrl) fullPrompt += `ইউটিউব ভিডিও বিশ্লেষণ করুন: ${youtubeUrl}\n\n`;
      if (prompt) fullPrompt += `ইউজারের প্রশ্ন: ${prompt}\n\n`;
      fullPrompt += `যদি কোড জেনারেট করতে হয়, তবে কোডটি অবশ্যই মার্কডাউন কোড ব্লকে (যেমন: \`\`\`javascript ... \`\`\`) লিখুন।`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: fullPrompt }] }]
          })
        });

        const data = await response.json();
        const responseText = data.candidates[0].content.parts[0].text;

        // চ্যাট হিস্ট্রিতে যোগ করা
        const userDiv = document.createElement('div');
        userDiv.className = "p-2 bg-blue-900/40 rounded text-blue-200 ml-6";
        userDiv.innerText = prompt || youtubeUrl;
        chatLog.appendChild(userDiv);

        const aiDiv = document.createElement('div');
        aiDiv.className = "p-3 bg-slate-800 rounded text-slate-100 mr-6 whitespace-pre-wrap border-l-2 border-blue-500";
        aiDiv.innerText = responseText;
        chatLog.appendChild(aiDiv);

        // কোড আলাদা করে এডিটরে বসানো
        const codeMatch = responseText.match(/```(?:\w+)?\n([\s\S]*?)```/);
        if (codeMatch && codeMatch[1] && editor) {
          editor.setValue(codeMatch[1]);
        }

        document.getElementById('prompt').value = "";
        document.getElementById('youtubeUrl').value = "";
        chatLog.scrollTop = chatLog.scrollHeight;
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        sendBtn.innerText = "পাঠান";
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
  </html>
